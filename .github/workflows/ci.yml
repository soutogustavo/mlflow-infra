name: CI MLflow Infra

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build MLflow Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MLflow imgage
        run: docker build -t mlflow-server ./mlflow

  test:
    name: Run Infrastructure Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file from GitHub Secrets
        run: |
          cat <<EOF > .env
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          MINIO_ROOT_USER=${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD=${{ secrets.MINIO_ROOT_PASSWORD }}
          MLFLOW_URL=http://localhost:5001
          MLFLOW_S3_ENDPOINT_URL=http://localhost:9000
          EOF

      - name: Start services
        run: |
          docker-compose \
            -f docker-compose.yml \
            -f environments/docker-compose.prod.yml \
            up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          until docker exec $(docker ps -qf "name=postgres") pg_isready -U ${{ secrets.POSTGRES_USER }}; do
            sleep 2
          done

          echo "Waiting for MinIO..."
          until curl -sf http://localhost:9000/minio/health/live; do
            sleep 2
          done

          echo "Waiting for MLflow..."
          until curl -sf http://localhost:5001; do
            sleep 2
          done

          echo "All services are healthy."

      - name: Create MinIO bucket
        run: |
          pip install awscli-local
          AWS_ACCESS_KEY_ID=${{ secrets.MINIO_ROOT_USER }} \
          AWS_SECRET_ACCESS_KEY=${{ secrets.MINIO_ROOT_PASSWORD }} \
          aws --endpoint-url http://localhost:9000 s3 mb s3://mlflow-artifacts

      - name: Set up Python with UV
        uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Tear down services
        if: always()
        run: |
          docker-compose \
            -f docker-compose.yml \
            -f environments/docker-compose.prod.yml \
            down -v
